<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101a23">
<title>Drug Intelligence AI · 药物研究工作台</title>
<link rel="stylesheet" href="./research/workspace.css">
<script type="module" src="./research/workspace.js"></script>
</head>
<body>
<aside>
<a class="brand" href="#">Drug Intelligence AI<span>药物研究工作台</span></a>
<nav aria-label="研究模块">
<a href="#explorer">药物全景</a><a href="#pipeline">研发管线</a>
<a href="#trials">临床研究</a><a href="./safety.html">药物安全 ↗</a>
<a href="#literature">文献证据</a><a href="#industry">产业情报</a>
<a href="#saved">我的研究</a>
</nav>
</aside>
<main>
<header class="intro">
<h1>从药物找到研究证据</h1>
<p>查药物档案、试验登记结果与关联文献。</p>
<label for="search">搜索药物、商品名、靶点、研究适应证或登记号</label>
<input id="search" type="search" placeholder="例如 Keytruda、EGFR 或 NCT03548935">
</header>
<p id="status" role="status">正在读取数据…</p>
<section id="explorer"><h2>药物全景</h2><div id="drugs" class="cards"></div><div id="profile" tabindex="-1"></div></section>
<section id="pipeline"><h2>研发管线</h2><p>状态与阶段来自所选试验登记。</p><div id="pipeline-data"></div></section>
<section id="trials"><h2>临床研究</h2><div id="trial-data"></div></section>
<section id="literature"><h2>文献证据</h2><div id="papers"></div></section>
<section id="industry"><h2>产业情报</h2><p>首版提供监管查询入口。审批动态和授权合作数据待接入。</p><div class="links"><a href="https://www.accessdata.fda.gov/scripts/cder/daf/">Drugs@FDA ↗</a><a href="https://www.ema.europa.eu/en/medicines/download-medicine-data">EMA 药品数据 ↗</a><a href="https://www.nmpa.gov.cn/datasearch/home-index.html">NMPA 数据查询 ↗</a></div></section>
<section id="saved"><h2>我的研究</h2><p>收藏与报告草稿保存在当前浏览器。</p><h3>收藏与最近研究</h3><div id="library"></div><h3>研究报告草稿</h3><div id="reports"></div><label for="draft">编辑当前草稿</label><textarea id="draft" rows="9"></textarea><div class="links"><button type="button" id="save-report">保存当前草稿</button><button type="button" id="download">导出 Markdown</button></div><p id="save-status" role="status"></p></section>
<footer>供科学研究与产品演示。临床使用请核对正式来源。</footer>
</main>
</body>
</html>
